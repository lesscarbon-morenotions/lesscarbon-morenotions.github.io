# Optional PR build check (no deploy — deploy-pages.yml owns production).
name: CI (build check)

on:
  pull_request:
    branches: [redesign, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
